name: Build Flutter APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
      - name: Generate clean Flutter project structure
        run: |
          # حفظ ملف الـ main.dart في مكان خارجي مؤقتاً
          if [ -f main.dart ]; then cp main.dart /tmp/main.dart; fi
          if [ -f lib/main.dart ]; then cp lib/main.dart /tmp/main.dart; fi
          
          # إزالة الملفات الجذرية المؤقتة لتنظيف مجلد العمل
          rm -f main.dart pubspec.yaml
          
          # إنشاء مشروع فلاتر جديد نظيف بالكامل في مجلد مؤقت
          flutter create temp_project --org com.yaqeen.lab --project-name yaqeen_lab --platforms=android
          
          # نقل محتويات المشروع الجديد إلى المجلد الرئيسي بحذر
          shopt -s dotglob
          mv temp_project/* .
          rmdir temp_project
          
          # استعادة كود الـ main.dart الخاص بك
          if [ -f /tmp/main.dart ]; then
            cp /tmp/main.dart lib/main.dart
          fi
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: yaqeen-apk
          path: build/app/outputs/flutter-apk/app-release.apk
