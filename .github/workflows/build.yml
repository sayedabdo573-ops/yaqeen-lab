name: Build Flutter APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
      - name: Generate Project and Fix Gradle
        run: |
          if [ -f main.dart ]; then cp main.dart /tmp/main.dart; fi
          if [ -f lib/main.dart ]; then cp lib/main.dart /tmp/main.dart; fi
          rm -f main.dart pubspec.yaml
          flutter create temp_project --org com.yaqeen.lab --project-name yaqeen_lab --platforms=android
          shopt -s dotglob
          mv temp_project/* .
          rmdir temp_project
          if [ -f /tmp/main.dart ]; then
            cp /tmp/main.dart lib/main.dart
          fi
          
          # تعديل إصدار الـ Gradle ليتوافق تماماً مع بيئة الخادم الحالية
          if [ -f android/gradle/wrapper/gradle-wrapper.properties ]; then
            sed -i 's/gradle-7.5-bin.zip/gradle-8.3-bin.zip/g' android/gradle/wrapper/gradle-wrapper.properties
            sed -i 's/gradle-7.6-bin.zip/gradle-8.3-bin.zip/g' android/gradle/wrapper/gradle-wrapper.properties
          fi
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: yaqeen-apk
          path: build/app/outputs/flutter-apk/app-release.apk
