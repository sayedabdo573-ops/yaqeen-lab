name: Build Flutter APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
      - name: Create complete Flutter project structure
        run: |
          # الاحتفاظ بملف الـ main.dart الخاص بك في مكان آمن مؤقتاً
          mkdir -p temp_dir
          if [ -f main.dart ]; then cp main.dart temp_dir/; fi
          if [ -f lib/main.dart ]; then cp lib/main.dart temp_dir/; fi
          
          # إنشاء مشروع فلاتر كامل ونظيف بالهيكل المطلوب للـ Gradle
          flutter create . --org com.yaqeen.lab --project-name yaqeen_lab --force
          
          # استعادة الكود الخاص بك في مكانه الصحيح داخل المشروع الجديد
          if [ -f temp_dir/main.dart ]; then
            cp temp_dir/main.dart lib/main.dart
          fi
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: yaqeen-apk
          path: build/app/outputs/flutter-apk/app-release.apk
