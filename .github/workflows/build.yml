name: Build Flutter APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.5'
          channel: 'stable'
      - name: Initialize and Fix Gradle Version
        run: |
          if [ -f main.dart ]; then cp main.dart /tmp/main.dart; fi
          if [ -f lib/main.dart ]; then cp lib/main.dart /tmp/main.dart; fi
          rm -rf lib android ios web linux macos windows pubspec.yaml main.dart
          
          flutter create . --org com.yaqeen.lab --project-name yaqeen_lab --platforms=android
          
          mkdir -p lib
          if [ -f /tmp/main.dart ]; then
            cp /tmp/main.dart lib/main.dart
          fi
          
          # رفع إصدار الـ Gradle ليتوافق مع الجافا الحديثة على الخادم
          if [ -f android/gradle/wrapper/gradle-wrapper.properties ]; then
            sed -i 's/distributionUrl=.*\/gradle-.*-bin.zip/distributionUrl=https\:\/\/services.gradle.org\/distributions\/gradle-8.5-bin.zip/g' android/gradle/wrapper/gradle-wrapper.properties
          fi
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: yaqeen-apk
          path: build/app/outputs/flutter-apk/app-release.apk
